<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>XSS Armazenado - {{MODE}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>XSS Armazenado <span class="badge {{BADGE_CLASS}}">{{MODE}}</span></h1>
  </header>
  <main>
    <a class="back" href="/">&larr; Voltar</a>
    <section class="card">
      <h3>Adicionar comentario</h3>
      <form method="POST" action="{{ACTION}}">
        <input type="text" name="author" placeholder="Seu nome" required>
        <textarea name="text" rows="3" placeholder="Comentario" required></textarea>
        <button type="submit">Publicar</button>
      </form>
    </section>
    <section class="card">
      <h3>Comentarios</h3>
      <ul class="comments">{{COMMENTS}}</ul>
    </section>
    <section class="card">
      <h3>Payload sugerido</h3>
      <pre>&lt;img src=x onerror="alert('Stored XSS!')"&gt;</pre>
      <p>Publique uma vez na versao vulneravel e veja o alert disparar a cada recarregamento.</p>
    </section>
  </main>
</body>
</html>
